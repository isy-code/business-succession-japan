<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="일본의 공식 사업승계 성공사례 17건"><title>성공사례 | 일본 사업승계 지원센터</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=mockup-4"><link rel="stylesheet" href="legacy-fix.css"><link rel="stylesheet" href="pages.css?v=4"><script defer src="app.js"></script></head><body data-page="cases"><header id="header"></header><main><section class="hero small"><div class="wrap"><p class="eyebrow">SUCCESS STORIES</p><h1>성공사례</h1><p class="lead">실제로 어떻게 사업이 이어지고 있는지, 공식 공개 사례를 통해 확인해 보세요.</p></div></section><section class="section"><div class="wrap"><h2>공식 공개 사례 17건</h2><p class="sub">카드를 누르면 일본 중소기업기반정비기구의 공식 원문이 새 창으로 열립니다.</p><div id="case-controls"></div><div id="case-root" class="grid three"></div></div></section></main><footer id="footer"></footer><script>(()=>{const mark=()=>document.querySelectorAll('.filters').forEach(g=>{if(!g.querySelector('.active'))g.querySelector('button')?.classList.add('active')});new MutationObserver(mark).observe(document.body,{childList:true,subtree:true});document.addEventListener('click',e=>{const b=e.target.closest('.filters button');if(b)b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))})})()</script></body></html>
