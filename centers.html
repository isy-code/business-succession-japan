<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="일본 47개 도도부현 사업승계·인수인계 지원센터"><title>지역별 지원센터 | 일본 사업승계 지원센터</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=mockup-4"><link rel="stylesheet" href="legacy-fix.css"><link rel="stylesheet" href="pages.css?v=3"><script defer src="app.js"></script></head><body data-page="centers"><header id="header"></header><main><section class="hero small"><div class="wrap"><p class="eyebrow">LOCAL SUPPORT CENTERS</p><h1>지역별 사업승계 지원센터</h1><p class="lead">일본 전역의 공식 지원센터 정보를 지역별로 확인하세요.</p></div></section><section class="section tint"><div class="wrap grid two"><div><h2>47개 도도부현을 연결합니다.</h2><p class="sub">지도는 지역별 지원 정보를 확인하기 위한 시각 자료입니다. 아래 목록에서 권역 및 도도부현을 검색할 수 있습니다.</p><img class="map" src="japan_outline.svg" alt="일본 지도"></div><div class="card"><h3>최신 정보 안내</h3><p>센터 주소와 연락처는 변경될 수 있습니다. 상담이나 방문 전에는 공식 출처에서 다시 확인해 주세요.</p><a class="button outline" target="_blank" rel="noopener noreferrer" href="https://shoukei.smrj.go.jp/center/">공식 포털 보기 ↗</a></div></div></section><section class="section"><div class="wrap"><h2>지역별 센터 찾기</h2><div id="center-controls"></div><div id="centers-root" class="grid three"></div></div></section></main><footer id="footer"></footer><script>(()=>{const mark=()=>document.querySelectorAll('.filters').forEach(g=>{if(!g.querySelector('.active'))g.querySelector('button')?.classList.add('active')});new MutationObserver(mark).observe(document.body,{childList:true,subtree:true});document.addEventListener('click',e=>{const b=e.target.closest('.filters button');if(b)b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))})})()</script></body></html>
