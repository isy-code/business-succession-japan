<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="일본 사업승계 상담 준비 안내"><title>상담하기 | 일본 사업승계 지원센터</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=mockup-4"><link rel="stylesheet" href="pages.css?v=2"><script defer src="app.js"></script></head><body data-page="contact"><header id="header"></header><main><section class="hero small"><div class="wrap"><p class="eyebrow">CONSULTATION</p><h1>상담하기</h1><p class="lead">현재 상황과 관심 분야를 정리해 상담 준비를 시작하세요.</p></div></section><section class="section"><div class="wrap grid two"><div><h2>상담 요청 준비</h2><p class="sub">현재 버전은 상담 화면 UI만 제공합니다. 작성한 내용은 전송되지 않습니다.</p><form id="consultation-form"><label class="field">이름 <input required name="name"></label><label class="field">연락처 <input required name="phone" type="tel"></label><label class="field">이메일 <input name="email" type="email"></label><label class="field">현재 지역 <input name="location"></label><label class="field">관심 산업 <select name="industry"><option value="">선택해 주세요</option><option>제조업</option><option>도소매업</option><option>서비스업</option><option>숙박·관광업</option><option>기타</option></select></label><label class="field">상담 희망 내용 <textarea name="message"></textarea></label><label><input required type="checkbox"> 개인정보 수집 및 이용에 동의합니다. (필수)</label><p><button class="button" type="submit">상담 요청하기</button></p></form><p id="form-message" class="notice hidden">상담 접수 기능은 준비 중입니다. 이 양식은 현재 정보를 전송하지 않습니다.</p></div><aside class="card"><h2>상담 진행 안내</h2><div class="steps"><div class="step"><b>01</b>한국어 상담</div><div class="step"><b>02</b>지역 전문가 연결</div><div class="step"><b>03</b>맞춤 정보 제공</div><div class="step"><b>04</b>전문가 협력</div></div><p>실제 상담 및 제도 이용 전에는 각 공식 기관의 최신 안내를 확인해 주세요.</p></aside></div></section></main><footer id="footer"></footer></body></html>
